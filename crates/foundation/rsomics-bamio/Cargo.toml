[package]
name = "rsomics-bamio"
version = "0.1.2"
description = "Parallel-BGZF BAM reader shared by the rsomics-bam-* tool family. Layer A primitive."
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omics-rust/rsomics-world"
authors = ["Zane Leong <efd@live.com>"]
readme = "README.md"
categories = ["science"]
keywords = ["bam", "bgzf", "bioinformatics", "samtools", "reader"]

[dependencies]
rsomics-common = { version = "0.6" }
noodles = { version = "0.110", features = ["sam", "bam", "bgzf"] }
# Quadrant ② (FFI): bundled-C libdeflate via the noodles-bgzf `libdeflate`
# feature. This is the inflate/deflate samtools uses; it switches every BGZF
# block in this crate's reader and writer off zlib-rs onto libdeflate, which
# wins single-threaded and widens the parallel margin. Declared directly (the
# noodles meta-crate doesn't pass the feature through) — Cargo unifies it onto
# the same noodles-bgzf the meta pulls in. Portable bundled C, no system lib.
noodles-bgzf = { version = "0.47", features = ["libdeflate"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

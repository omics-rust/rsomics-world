[package]
name = "rsomics-bamio"
version = "0.1.1"
description = "Parallel-BGZF BAM reader shared by the rsomics-bam-* tool family. Layer A primitive."
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omics-rust/rsomics-world"
authors = ["Zane Leong <efd@live.com>"]
readme = "README.md"
categories = ["science"]
keywords = ["bam", "bgzf", "bioinformatics", "samtools", "reader"]

[dependencies]
rsomics-common = { version = "0.6" }
noodles = { version = "0.110", features = ["sam", "bam", "bgzf"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

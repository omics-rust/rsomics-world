[package]
name = "rsomics-coverage-core"
version = "0.1.0"
description = "Genome-binned BAM read-coverage primitive (deeptools countReadsPerBin port): per-bin read counts over a BGZF BAM via rsomics-bamio, shared by rsomics-bam-signal (bamCoverage) and rsomics-bam-compare (bamCompare)."
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omics-rust/rsomics-world"
authors = ["Zane Leong <efd@live.com>"]
readme = "README.md"
categories = ["science"]
keywords = ["bam", "coverage", "bioinformatics", "deeptools", "bedgraph"]

[dependencies]
rsomics-common = { version = "0.6" }
rsomics-bamio = { version = "0.1.7" }

[lints]
workspace = true

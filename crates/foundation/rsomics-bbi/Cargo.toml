[package]
name = "rsomics-bbi"
version = "0.1.2"
description = "Pure-Rust bigWig/BBI reader and writer: header, chromosome B-tree, R-tree interval search, bedGraph/varStep/fixedStep section decode, zoom-level statistics, and a write_bigwig API that emits valid bigWig from (chrom,start,end,value) intervals."
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omics-rust/rsomics-world"
authors = ["Zane Leong <efd@live.com>"]
readme = "README.md"
categories = ["science", "parser-implementations"]
keywords = ["bigwig", "bbi", "bioinformatics", "deeptools", "genomics"]

[dependencies]
rsomics-common = { version = "0.6" }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

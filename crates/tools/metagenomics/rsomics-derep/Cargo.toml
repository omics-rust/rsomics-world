[package]
name = "rsomics-derep"
version = "0.1.0"
description = "Full-length FASTA dereplication — port of vsearch --derep_fulllength"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omics-rust/rsomics-world"
authors = ["Zane Leong <efd@live.com>"]

[[bin]]
name = "rsomics-derep"
path = "src/main.rs"

[lib]
name = "rsomics_derep"
path = "src/lib.rs"

[dependencies]
rsomics-common = { version = "0.6", features = ["rayon"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rayon = "1"
ahash = "0.8"

[dev-dependencies]
rsomics-common = { version = "0.6", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true

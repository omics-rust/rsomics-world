[package]
name = "rsomics-mismatch-profile"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/omics-rust/rsomics-mismatch-profile"
authors.workspace = true
description = "Per-base mismatch-rate profile from BAM MD tags — Rust port of RSeQC mismatch_profile.py"

[[bin]]
name = "rsomics-mismatch-profile"
path = "src/main.rs"

[dependencies]
rsomics-common = { path = "../../../foundation/rsomics-common", version = "0.6" }
rsomics-bamio = "0.1"
clap.workspace = true
noodles = { workspace = true, features = ["sam", "bam"] }

[dev-dependencies]
tempfile = "3"

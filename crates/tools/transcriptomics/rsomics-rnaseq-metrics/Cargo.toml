[package]
name = "rsomics-rnaseq-metrics"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omics-rust/rsomics-world"
authors = ["Zane Leong <efd@live.com>"]
description = "RNA-seq QC metrics (region coverage fractions, strand bias, transcript-coverage bias) — Rust port of Picard CollectRnaSeqMetrics"

[[bin]]
name = "rsomics-rnaseq-metrics"
path = "src/main.rs"

[dependencies]
rsomics-common = { version = "0.6" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
noodles = { version = "0.110", features = ["sam", "bam", "core"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

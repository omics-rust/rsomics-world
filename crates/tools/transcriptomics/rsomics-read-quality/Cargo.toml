[package]
name = "rsomics-read-quality"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omics-rust/rsomics-read-quality"
authors = ["Zane Leong <efd@live.com>"]
description = "Per-base read-quality heatmap and boxplot from BAM — Rust port of RSeQC read_quality.py"

[[bin]]
name = "rsomics-read-quality"
path = "src/main.rs"

[dependencies]
rsomics-common = { version = "0.6" }
rsomics-help = { version = "0.3" }
rsomics-bamio = { version = "0.1" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

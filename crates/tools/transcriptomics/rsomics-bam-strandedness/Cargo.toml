[package]
name = "rsomics-bam-strandedness"
version = "0.1.1"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omics-rust/rsomics-world"
authors = ["Zane Leong <efd@live.com>"]
description = "Infer RNA-seq library strand protocol from BAM + BED12 gene model — Rust port of RSeQC infer_experiment.py"

[[bin]]
name = "rsomics-bam-strandedness"
path = "src/main.rs"

[dependencies]
rsomics-common = { version = "0.6" }
rsomics-bamio = { version = "0.1" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
noodles = { version = "0.110", features = ["sam", "bam"] }
coitrees = "0.4"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "strandedness"
harness = false

[lints]
workspace = true

[package]
name = "rsomics-count-matrix"
version = "0.1.0"
description = "Merge multiple featureCounts/htseq-count outputs into a single gene × sample count matrix"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "rsomics-count-matrix"
path = "src/main.rs"

[lib]
name = "rsomics_count_matrix"
path = "src/lib.rs"

[dependencies]
rsomics-common = { path = "../../../foundation/rsomics-common", version = "0.6" }
rsomics-help = { path = "../../../foundation/rsomics-help", version = "0.3" }
clap.workspace = true

[lints]
workspace = true

[package]
name = "rsomics-methyldackel"
version = "0.1.0"
description = "Per-CpG methylation extraction from bisulfite-aligned BAM — Rust port of MethylDackel extract"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omics-rust/rsomics-world"
authors = ["Zane Leong <efd@live.com>"]
readme = "README.md"
categories = ["science"]
keywords = ["bisulfite", "methylation", "cpg", "epigenomics", "bioinformatics"]

[[bin]]
name = "rsomics-methyldackel"
path = "src/main.rs"

[lib]
name = "rsomics_methyldackel"
path = "src/lib.rs"

[dependencies]
rsomics-common = { version = "0.6" }
rsomics-help = { version = "0.3" }
rsomics-bamio = { version = "0.1.7" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
noodles = { version = "0.110", features = ["fasta"] }

[dev-dependencies]
tempfile = "3"

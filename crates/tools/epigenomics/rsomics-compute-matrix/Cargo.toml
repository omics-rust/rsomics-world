[package]
name = "rsomics-compute-matrix"
version = "0.1.0"
description = "bigWig signal → score matrix over BED regions — Rust port of deeptools computeMatrix"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omics-rust/rsomics-world"
authors = ["Zane Leong <efd@live.com>"]

[[bin]]
name = "rsomics-compute-matrix"
path = "src/main.rs"

[lib]
name = "rsomics_compute_matrix"
path = "src/lib.rs"

[dependencies]
rsomics-common = { version = "0.6" }
rsomics-help = { version = "0.3" }
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

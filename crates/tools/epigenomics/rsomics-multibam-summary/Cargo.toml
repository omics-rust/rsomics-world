[package]
name = "rsomics-multibam-summary"
version = "0.1.0"
description = "Multi-BAM per-bin / per-region read-count matrix — Rust port of deeptools multiBamSummary"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omics-rust/rsomics-world"
authors = ["Zane Leong <efd@live.com>"]

[[bin]]
name = "rsomics-multibam-summary"
path = "src/main.rs"

[lib]
name = "rsomics_multibam_summary"
path = "src/lib.rs"

[dependencies]
rsomics-common = { version = "0.6" }
rsomics-help = { version = "0.3" }
rsomics-coverage-core = { version = "0.1" }
rsomics-bamio = { version = "0.1" }
rsomics-intervals = { version = "0.1" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

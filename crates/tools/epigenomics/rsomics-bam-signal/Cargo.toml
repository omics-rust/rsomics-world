[package]
name = "rsomics-bam-signal"
version = "0.1.0"
description = "Binned BAM → bedGraph signal track — Rust port of deeptools bamCoverage"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omics-rust/rsomics-world"
authors = ["Zane Leong <efd@live.com>"]

[[bin]]
name = "rsomics-bam-signal"
path = "src/main.rs"

[lib]
name = "rsomics_bam_signal"
path = "src/lib.rs"

[dependencies]
rsomics-common = { version = "0.6" }
rsomics-help = { version = "0.3" }
rsomics-bamio = { version = "0.1.7" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

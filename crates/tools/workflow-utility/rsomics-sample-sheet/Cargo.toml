[package]
name = "rsomics-sample-sheet"
version = "0.1.0"
description = "Parse, validate, and convert sample sheets (Illumina/custom TSV) — check FASTQ paths, detect paired-end, generate configs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "rsomics-sample-sheet"
path = "src/main.rs"

[lib]
name = "rsomics_sample_sheet"
path = "src/lib.rs"

[dependencies]
rsomics-common = { path = "../../../foundation/rsomics-common", version = "0.6" }
rsomics-help = { path = "../../../foundation/rsomics-help", version = "0.3" }
clap.workspace = true

[lints]
workspace = true

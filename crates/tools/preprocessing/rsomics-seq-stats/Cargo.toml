[package]
name = "rsomics-seq-stats"
version = "0.1.0"
description = "Quick stats for any FASTA/FASTQ — count, total bp, N50, GC%, min/max/mean length"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
[[bin]]
name = "rsomics-seq-stats"
path = "src/main.rs"
[lib]
name = "rsomics_seq_stats"
path = "src/lib.rs"
[dependencies]
rsomics-common = { path = "../../../foundation/rsomics-common", version = "0.6" }
rsomics-help = { path = "../../../foundation/rsomics-help", version = "0.3" }
clap.workspace = true
needletail = { version = "0.7", default-features = false, features = ["compression"] }
[lints]
workspace = true

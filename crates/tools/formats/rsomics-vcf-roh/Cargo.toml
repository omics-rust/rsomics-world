[package]
name = "rsomics-vcf-roh"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omics-rust/rsomics-vcf-roh"
authors = ["Zane Leong <efd@live.com>"]
description = "Runs-of-homozygosity detector — Rust port of bcftools roh"

[[bin]]
name = "rsomics-vcf-roh"
path = "src/main.rs"

[dependencies]
rsomics-common = { version = "0.6" }
rsomics-help = { version = "0.3" }
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

[dev-dependencies]
tempfile = "3"

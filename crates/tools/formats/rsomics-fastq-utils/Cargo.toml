[package]
name = "rsomics-fastq-utils"
version = "0.1.0"
description = "FASTQ utility toolkit — lightweight subcommands for counting, filtering, converting, and inspecting FASTQ files"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "rsomics-fastq-utils"
path = "src/main.rs"

[dependencies]
rsomics-common = { path = "../../../foundation/rsomics-common", version = "0.6" }
rsomics-help = { path = "../../../foundation/rsomics-help", version = "0.3" }
rsomics-seqio = { path = "../../../foundation/rsomics-seqio", version = "0.1" }
clap = { workspace = true }
regex = "1"
rand = "0.8"

[lints]
workspace = true

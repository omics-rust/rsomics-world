[package]
name = "rsomics-vcf-convert"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omics-rust/rsomics-world"
authors = ["Zane Leong <efd@live.com>"]
description = "Convert between VCF text, bgzipped VCF, and HAP/LEGEND/SAMPLE — Rust port of bcftools convert"

[[bin]]
name = "rsomics-vcf-convert"
path = "src/main.rs"

[lib]
name = "rsomics_vcf_convert"
path = "src/lib.rs"

[dependencies]
rsomics-common = { version = "0.6" }
rsomics-help = { version = "0.3" }
clap = { version = "4", features = ["derive"] }
flate2 = "1"

[dev-dependencies]

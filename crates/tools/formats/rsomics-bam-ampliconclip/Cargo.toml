[package]
name = "rsomics-bam-ampliconclip"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omics-rust/rsomics-world"
authors = ["Zane Leong <efd@live.com>"]
description = "Clip amplicon primer regions off aligned reads given a BED — Rust port of samtools ampliconclip"

[[bin]]
name = "rsomics-bam-ampliconclip"
path = "src/main.rs"

[dependencies]
rsomics-common = { version = "0.6" }
rsomics-bamio = { version = "0.1.5" }
rsomics-help = { version = "0.3" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
noodles = { version = "0.110", features = ["sam", "bam"] }

[dev-dependencies]
tempfile = "3"

[package]
name = "rsomics-bam-calmd"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omics-rust/rsomics-world"
authors = ["Zane Leong <efd@live.com>"]
description = "Recompute the MD and NM aux tags against a reference FASTA — Rust port of samtools calmd"

[[bin]]
name = "rsomics-bam-calmd"
path = "src/main.rs"

[dependencies]
rsomics-common = { version = "0.6" }
rsomics-bamio = { version = "0.1.6" }
rsomics-help = { version = "0.3" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
noodles = { version = "0.110", features = ["core", "sam", "bam", "fasta"] }
rayon = "1"

[dev-dependencies]
tempfile = "3"

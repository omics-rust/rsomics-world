[package]
name = "rsomics-fastq-sample"
version = "0.1.1"
description = "Random subsample FASTQ records by fraction or exact count — seqkit sample / seqtk sample equivalent"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omics-rust/rsomics-world"
authors = ["Zane Leong <efd@live.com>"]
categories = ["science", "command-line-utilities"]
keywords = ["fastq", "subsample", "bioinformatics", "seqkit", "sequencing"]

[[bin]]
name = "rsomics-fastq-sample"
path = "src/main.rs"

[lib]
name = "rsomics_fastq_sample"
path = "src/lib.rs"
doctest = false

[dependencies]
rsomics-common = { version = "0.6" }
rsomics-help = { version = "0.3" }
clap = { version = "4", features = ["derive"] }
needletail = "0.6"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
rand = { version = "0.9", features = ["small_rng"] }

[dev-dependencies]
rsomics-common = { version = "0.6", features = ["test-support"] }
tempfile = "3"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

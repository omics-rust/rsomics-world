[package]
name = "rsomics-gff-utils"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "GFF/GTF utility toolkit — count, filter, extract, sort, convert, and stats operations"

[[bin]]
name = "rsomics-gff-utils"
path = "src/main.rs"

[dependencies]
rsomics-common = { path = "../../../foundation/rsomics-common", version = "0.5" }
clap = { workspace = true, features = ["derive"] }
regex = "1"

[lints]
workspace = true

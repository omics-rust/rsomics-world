[package]
name = "rsomics-bam-reset"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omics-rust/rsomics-world"
authors = ["Zane Leong <efd@live.com>"]
description = "Revert aligner changes in BAM reads (flags, position, cigar, aux tags, orientation) — Rust port of samtools reset"

[[bin]]
name = "rsomics-bam-reset"
path = "src/main.rs"

[dependencies]
rsomics-common = { version = "0.6" }
rsomics-bamio = { version = "0.1.9" }
rsomics-help = { version = "0.3" }
clap = { version = "4", features = ["derive"] }
noodles = { version = "0.110", features = ["sam", "bam"] }

[dev-dependencies]
tempfile = "3"

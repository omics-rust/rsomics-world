[package]
name = "rsomics-bam-region"
version = "0.1.0"
description = "Extract BAM reads overlapping a genomic region (chr:start-end) — indexed random access"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "rsomics-bam-region"
path = "src/main.rs"

[lib]
name = "rsomics_bam_region"
path = "src/lib.rs"

[dependencies]
rsomics-common = { path = "../../../foundation/rsomics-common", version = "0.5" }
rsomics-help = { path = "../../../foundation/rsomics-help", version = "0.3" }
clap.workspace = true
noodles = { workspace = true, features = ["sam", "bam", "core", "csi", "bgzf"] }

[lints]
workspace = true

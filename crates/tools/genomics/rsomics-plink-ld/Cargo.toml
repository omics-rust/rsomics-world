[package]
name = "rsomics-plink-ld"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omics-rust/rsomics-plink-ld"
authors = ["Zane Leong <efd@live.com>"]
description = "Pairwise LD (r²) computation and LD matrix export from PLINK1 binary filesets"

[[bin]]
name = "rsomics-plink-ld"
path = "src/main.rs"

[lib]
name = "rsomics_plink_ld"
path = "src/lib.rs"
doctest = false

[[bench]]
name = "bench"
harness = false

[dependencies]
rsomics-common = { version = "0.6" }
rsomics-pgen = { version = "0.2" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"

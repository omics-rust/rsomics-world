[package]
name = "rsomics-vcf-to-bed"
version = "0.1.0"
description = "Convert VCF variant positions to BED intervals"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
[[bin]]
name = "rsomics-vcf-to-bed"
path = "src/main.rs"
[lib]
name = "rsomics_vcf_to_bed"
path = "src/lib.rs"
[dependencies]
rsomics-common = { path = "../../../foundation/rsomics-common", version = "0.6" }
rsomics-help = { path = "../../../foundation/rsomics-help", version = "0.3" }
clap.workspace = true
noodles = { workspace = true, features = ["vcf"] }
[lints]
workspace = true

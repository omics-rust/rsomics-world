[package]
name = "rsomics-consensus"
version = "0.1.0"
description = "Compute consensus sequence from a multiple sequence alignment — majority-rule or threshold"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "rsomics-consensus"
path = "src/main.rs"

[lib]
name = "rsomics_consensus"
path = "src/lib.rs"

[dependencies]
rsomics-common = { path = "../../../foundation/rsomics-common", version = "0.6" }
rsomics-help = { path = "../../../foundation/rsomics-help", version = "0.3" }
clap.workspace = true
needletail = { version = "0.7", default-features = false }

[lints]
workspace = true

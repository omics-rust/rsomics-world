name: csvtk performance gate
description: Fail when an rsomics CSV tool regresses by more than 10% from its reviewed ratio

inputs:
  binary:
    description: Path to the release binary
    required: true
  ours-args:
    description: Arguments before the generated CSV fixture
    required: true
  csvtk-operation:
    description: csvtk subcommand
    required: true
  csvtk-args:
    description: csvtk arguments before the generated CSV fixture
    required: true
  baseline-ratio:
    description: Reviewed upstream/rsomics mean-time ratio
    required: true
  runs:
    description: Timed samples per side
    required: false
    default: "10"

runs:
  using: composite
  steps:
    - name: Install pinned csvtk oracle
      shell: bash
      run: |
        archive="${RUNNER_TEMP}/csvtk_linux_amd64.tar.gz"
        curl -fsSL \
          "https://github.com/shenwei356/csvtk/releases/download/v0.37.0/csvtk_linux_amd64.tar.gz" \
          -o "${archive}"
        printf '%s  %s\n' \
          f6d09493b7ad1ba8c5ee79e6904de9499f7411ca97fcfcd8cf6b816e9c967411 \
          "${archive}" | sha256sum -c -
        mkdir -p "${RUNNER_TEMP}/csvtk-perfgate"
        tar -xzf "${archive}" -C "${RUNNER_TEMP}/csvtk-perfgate"
        printf '%s\n' "${RUNNER_TEMP}/csvtk-perfgate" >> "${GITHUB_PATH}"
    - name: Enforce performance baseline
      shell: bash
      env:
        PERF_BINARY: ${{ inputs.binary }}
        PERF_OURS_ARGS: ${{ inputs.ours-args }}
        PERF_CSVTK_OPERATION: ${{ inputs.csvtk-operation }}
        PERF_CSVTK_ARGS: ${{ inputs.csvtk-args }}
        PERF_BASELINE_RATIO: ${{ inputs.baseline-ratio }}
        PERF_RUNS: ${{ inputs.runs }}
      run: >-
        python3
        "${{ github.action_path }}/perfgate.py"

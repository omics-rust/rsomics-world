name: Single-cell CNV core candidate

on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: Frozen snapshot directory, for example red-1 or green-1
        type: string
        required: true
      expected_red:
        description: Run the initial Linux-only test-first failure capture
        type: boolean
        default: false
      measurement:
        description: Test private measurement support and compile its opt-in bench
        type: boolean
        default: false
      ingestion_measurement:
        description: Test private exact raw-creation comparison and export support
        type: boolean
        default: false
      resolve_measurement_lock:
        description: Resolve the measurement dev-dependency only in a test-first run
        type: boolean
        default: false
      oracle_receipt:
        description: Explicit accepted external oracle; none runs only small fixtures
        type: choice
        default: none
        options:
          - none
          - infercnv-shipped-2026-09-26
      resolve_input_lock:
        description: Resolve raw-input gzip nodes in a Linux test-first run
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.expected_red && '[{"target":"linux-x86_64","runner":"ubuntu-24.04","system":"Linux","arch":"x86_64"}]' || '[{"target":"linux-x86_64","runner":"ubuntu-24.04","system":"Linux","arch":"x86_64"},{"target":"linux-aarch64","runner":"ubuntu-24.04-arm","system":"Linux","arch":"aarch64"},{"target":"macos-x86_64","runner":"macos-15-intel","system":"Darwin","arch":"x86_64"},{"target":"macos-aarch64","runner":"macos-15","system":"Darwin","arch":"arm64"}]') }}
    env:
      SNAPSHOT_ID: ${{ inputs.snapshot }}
      EXPECT_RED: ${{ inputs.expected_red }}
      ORACLE_RECEIPT: ${{ inputs.oracle_receipt }}
      MEASUREMENT: ${{ inputs.measurement }}
      INGESTION_MEASUREMENT: ${{ inputs.ingestion_measurement }}
      RESOLVE_MEASUREMENT_LOCK: ${{ inputs.resolve_measurement_lock }}
      RESOLVE_INPUT_LOCK: ${{ inputs.resolve_input_lock }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify and extract frozen source
        id: snapshot
        run: |
          set -euo pipefail
          [[ "$SNAPSHOT_ID" =~ ^(red|green)-[0-9]+$ ]]
          if [[ "$INGESTION_MEASUREMENT" == true ]]; then
            test "$MEASUREMENT" = true
          fi
          if [[ "$RESOLVE_MEASUREMENT_LOCK" == true ]]; then
            test "$EXPECT_RED" = true
            test "$MEASUREMENT" = true
            test "$RESOLVE_INPUT_LOCK" != true
          fi
          if [[ "$RESOLVE_INPUT_LOCK" == true ]]; then
            test "$EXPECT_RED" = true
          fi
          test "$(uname -s)" = '${{ matrix.system }}'
          test "$(uname -m)" = '${{ matrix.arch }}'
          export CARGO_HOME="$RUNNER_TEMP/cargo-home"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/cargo-target"
          export RUSTUP_HOME="$RUNNER_TEMP/rustup-home"
          export TMPDIR="$RUNNER_TEMP/scratch"
          export EVIDENCE="$RUNNER_TEMP/sc-cnv-evidence"
          printf 'CARGO_HOME=%s\nCARGO_TARGET_DIR=%s\nRUSTUP_HOME=%s\nTMPDIR=%s\nEVIDENCE=%s\n' \
            "$CARGO_HOME" "$CARGO_TARGET_DIR" "$RUSTUP_HOME" "$TMPDIR" "$EVIDENCE" >> "$GITHUB_ENV"
          mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR" "$RUSTUP_HOME" "$TMPDIR" "$EVIDENCE"
          snapshot="$GITHUB_WORKSPACE/.autopilot/snapshots/sc-cnv-core-2026-09-26/$SNAPSHOT_ID"
          (
            cd "$snapshot"
            shasum -a 256 --check checksums.sha256
          ) | tee "$EVIDENCE/archive-verification.log"
          mkdir "$RUNNER_TEMP/sc-cnv-candidate"
          tar -xzf "$snapshot/source.tar.gz" -C "$RUNNER_TEMP/sc-cnv-candidate" --no-same-owner
          cp "$snapshot/source.tar.gz" "$snapshot/files.sha256" \
            "$snapshot/checksums.sha256" "$snapshot/README.md" "$EVIDENCE/"
          (
            cd "$RUNNER_TEMP/sc-cnv-candidate"
            shasum -a 256 --check "$EVIDENCE/files.sha256"
          ) | tee "$EVIDENCE/source-before.log"
          {
            git rev-parse HEAD
            uname -a
            df -h
            printf 'snapshot=%s\nexpected_red=%s\nmeasurement=%s\ningestion_measurement=%s\nresolve_measurement_lock=%s\n' \
              "$SNAPSHOT_ID" "$EXPECT_RED" "$MEASUREMENT" "$INGESTION_MEASUREMENT" "$RESOLVE_MEASUREMENT_LOCK"
            printf 'CARGO_HOME=%s\nCARGO_TARGET_DIR=%s\nRUSTUP_HOME=%s\nTMPDIR=%s\n' \
              "$CARGO_HOME" "$CARGO_TARGET_DIR" "$RUSTUP_HOME" "$TMPDIR"
          } | tee "$EVIDENCE/host.log"

      - name: Acquire and verify pinned external oracle
        if: ${{ inputs.oracle_receipt != 'none' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$ORACLE_RECEIPT" = infercnv-shipped-2026-09-26
          mkdir "$EVIDENCE/oracle-acquisition"
          receipt="$GITHUB_WORKSPACE/.autopilot/oracles/$ORACLE_RECEIPT.json"
          cp "$receipt" "$EVIDENCE/oracle-acquisition/receipt.json"
          python3 -B - "$receipt" > "$EVIDENCE/oracle-acquisition/selection.txt" <<'PY'
          import json, sys
          from pathlib import Path
          receipt = json.loads(Path(sys.argv[1]).read_text())
          assert receipt["repository"] == "omics-rust/rsomics-world"
          for key in ("run_id", "artifact_id"):
              assert type(receipt[key]) is int and receipt[key] > 0
          print(receipt["run_id"], receipt["artifact_id"])
          PY
          read -r oracle_run oracle_artifact < "$EVIDENCE/oracle-acquisition/selection.txt"
          gh api "repos/omics-rust/rsomics-world/actions/runs/$oracle_run" \
            > "$EVIDENCE/oracle-acquisition/run.json"
          gh api "repos/omics-rust/rsomics-world/actions/artifacts/$oracle_artifact" \
            > "$EVIDENCE/oracle-acquisition/artifact.json"
          gh api "repos/omics-rust/rsomics-world/actions/artifacts/$oracle_artifact/zip" \
            > "$RUNNER_TEMP/infercnv-oracle.zip"
          PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/verify_infercnv_oracle_artifact.py \
            --receipt "$receipt" \
            --run-json "$EVIDENCE/oracle-acquisition/run.json" \
            --artifact-json "$EVIDENCE/oracle-acquisition/artifact.json" \
            --zip "$RUNNER_TEMP/infercnv-oracle.zip" \
            --output-dir "$RUNNER_TEMP/infercnv-oracle-verified" \
            2>&1 | tee "$EVIDENCE/oracle-acquisition/verification.log"
          oracle_root="$RUNNER_TEMP/infercnv-oracle-verified/shipped-bundle"
          PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/validate_infercnv_oracle.py \
            "$RUNNER_TEMP/infercnv-oracle-verified/bundle" \
            2>&1 | tee "$EVIDENCE/oracle-acquisition/synthetic-semantic-validation.log"
          PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/validate_infercnv_shipped_oracle.py \
            "$oracle_root" 2>&1 | tee "$EVIDENCE/oracle-acquisition/semantic-validation.log"
          cp "$oracle_root/sha256-manifest.tsv" "$oracle_root/oracle.json" \
            "$EVIDENCE/oracle-acquisition/"
          printf 'RSOMICS_INFER_CNV_ORACLE_ROOT=%s\n' "$oracle_root" >> "$GITHUB_ENV"

      - name: Install Rust 1.91
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy,rustfmt

      - name: Verify dependency resolution and output path
        id: metadata
        working-directory: ${{ runner.temp }}/sc-cnv-candidate
        run: |
          set -euo pipefail
          rustc -Vv | tee "$EVIDENCE/rustc.log"
          cargo -V | tee "$EVIDENCE/cargo.log"
          if [[ "$RESOLVE_INPUT_LOCK" == true ]]; then
            cp Cargo.lock "$EVIDENCE/Cargo.before.lock"
            cargo metadata --all-features --format-version 1 > "$EVIDENCE/lock-resolution-metadata.json"
            python3 -B "$GITHUB_WORKSPACE/scripts/verify_infercnv_input_lock.py" \
              "$EVIDENCE/Cargo.before.lock" Cargo.lock | tee "$EVIDENCE/lock-resolution.log"
          fi
          if [[ "$RESOLVE_MEASUREMENT_LOCK" == true ]]; then
            cp Cargo.lock "$EVIDENCE/Cargo.before.lock"
            cargo metadata --all-features --format-version 1 > "$EVIDENCE/lock-resolution-metadata.json"
            python3 -B - <<'PY' | tee "$EVIDENCE/lock-resolution.log"
          import os, tomllib
          from pathlib import Path
          before = tomllib.loads((Path(os.environ["EVIDENCE"]) / "Cargo.before.lock").read_text())
          after = tomllib.loads(Path("Cargo.lock").read_text())
          assert before.keys() == after.keys() and before["version"] == after["version"]
          def packages(document):
              result = {}
              for package in document["package"]:
                  key = (package["name"], package["version"], package.get("source"))
                  assert key not in result, "duplicate lock package"
                  result[key] = package
              return result
          old, new = packages(before), packages(after)
          assert old.keys() <= new.keys(), "existing lock package removed or changed"
          for key, package in old.items():
              if key[0] == "rsomics-sc":
                  expected = dict(package)
                  expected["dependencies"] = sorted(package["dependencies"] + ["nix"])
                  assert new[key] == expected, "unexpected root dependency change"
              else:
                  assert new[key] == package, f"existing package changed: {key}"
          added = [new[key] for key in new.keys() - old.keys()]
          assert {p["name"] for p in added} == {"nix", "cfg_aliases"}
          assert len(added) == 2
          nix = next(p for p in added if p["name"] == "nix")
          assert nix["version"] == "0.29.0"
          assert nix["dependencies"] == ["bitflags", "cfg-if", "cfg_aliases", "libc"]
          for package in sorted(added, key=lambda p: p["name"]):
              assert package["source"] == "registry+https://github.com/rust-lang/crates.io-index"
              print(package["name"], package["version"], package["checksum"])
          print("Existing lock packages preserved; only measurement dependency nodes added.")
          PY
          fi
          if [[ "$EXPECT_RED" == true && ! -f Cargo.lock ]]; then
            cargo generate-lockfile 2>&1 | tee "$EVIDENCE/lock-resolution.log"
          fi
          cargo metadata --locked --format-version 1 > "$EVIDENCE/metadata.json"
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          metadata = json.loads((Path(os.environ["EVIDENCE"]) / "metadata.json").read_text())
          assert Path(metadata["target_directory"]).resolve() == Path(os.environ["CARGO_TARGET_DIR"]).resolve()
          package = next(p for p in metadata["packages"] if p["name"] == "rsomics-sc")
          assert package["publish"] == []
          assert all("bin" not in target["kind"] for target in package["targets"])
          PY
          cp Cargo.lock "$EVIDENCE/Cargo.lock"

      - name: Test ingestion support debug
        if: ${{ !cancelled() && inputs.ingestion_measurement && steps.metadata.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/sc-cnv-candidate
        run: |
          set -euo pipefail
          cargo test --locked --features infercnv-measurement --test cnv_ingestion_measurement_contract \
            -- --nocapture 2>&1 | tee "$EVIDENCE/ingestion-debug.log"

      - name: Test ingestion support release
        if: ${{ !cancelled() && inputs.ingestion_measurement && !inputs.expected_red && steps.metadata.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/sc-cnv-candidate
        run: |
          set -euo pipefail
          cargo test --locked --release --features infercnv-measurement --test cnv_ingestion_measurement_contract \
            -- --nocapture 2>&1 | tee "$EVIDENCE/ingestion-release.log"

      - name: Test measurement support debug
        if: ${{ !cancelled() && inputs.measurement && steps.metadata.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/sc-cnv-candidate
        run: |
          set -euo pipefail
          cargo test --locked --features infercnv-measurement --test cnv_measurement_contract \
            -- --nocapture 2>&1 | tee "$EVIDENCE/measurement-debug.log"

      - name: Test measurement support release and compile bench
        if: ${{ !cancelled() && inputs.measurement && !inputs.expected_red && steps.metadata.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/sc-cnv-candidate
        run: |
          set -euo pipefail
          cargo test --locked --release --features infercnv-measurement --test cnv_measurement_contract \
            -- --nocapture 2>&1 | tee "$EVIDENCE/measurement-release.log"
          cargo check --locked --all-features --bench cnv_matched \
            2>&1 | tee "$EVIDENCE/measurement-bench-check.log"

      - name: Require explicit external oracle configuration
        if: ${{ inputs.oracle_receipt != 'none' && !inputs.expected_red && matrix.target == 'linux-x86_64' }}
        working-directory: ${{ runner.temp }}/sc-cnv-candidate
        run: |
          set -euo pipefail
          set +e
          env -u RSOMICS_INFER_CNV_ORACLE_ROOT cargo test --locked \
            --features external-infercnv-oracle --test cnv_external_oracle -- --nocapture \
            > "$EVIDENCE/external-missing-root.log" 2>&1
          test_rc=$?
          set -e
          test "$test_rc" -ne 0
          grep -F 'RSOMICS_INFER_CNV_ORACLE_ROOT is required' "$EVIDENCE/external-missing-root.log"
          grep -F 'test result: FAILED' "$EVIDENCE/external-missing-root.log"

      - name: Test debug
        if: ${{ !cancelled() && steps.metadata.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/sc-cnv-candidate
        run: |
          set -euo pipefail
          test_args=(test --locked --all-targets --no-fail-fast)
          if [[ "$ORACLE_RECEIPT" != none ]]; then test_args+=(--features external-infercnv-oracle); fi
          cargo "${test_args[@]}" -- --nocapture 2>&1 | tee "$EVIDENCE/test-debug.log"

      - name: Test release
        if: ${{ !cancelled() && !inputs.expected_red && steps.metadata.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/sc-cnv-candidate
        run: |
          set -euo pipefail
          test_args=(test --locked --release --all-targets --no-fail-fast)
          if [[ "$ORACLE_RECEIPT" != none ]]; then test_args+=(--features external-infercnv-oracle); fi
          cargo "${test_args[@]}" -- --nocapture 2>&1 | tee "$EVIDENCE/test-release.log"

      - name: Format and strict Clippy
        if: ${{ !cancelled() && !inputs.expected_red && steps.metadata.outcome == 'success' && matrix.target == 'linux-x86_64' }}
        working-directory: ${{ runner.temp }}/sc-cnv-candidate
        run: |
          set -euo pipefail
          cargo fmt --all -- --check 2>&1 | tee "$EVIDENCE/format.log"
          clippy_args=(clippy --locked --all-targets)
          if [[ "$MEASUREMENT" == true ]]; then
            clippy_args+=(--all-features)
          elif [[ "$ORACLE_RECEIPT" != none ]]; then
            clippy_args+=(--features external-infercnv-oracle)
          fi
          cargo "${clippy_args[@]}" -- -D warnings 2>&1 | tee "$EVIDENCE/clippy.log"

      - name: Verify source remains unchanged
        if: ${{ always() && steps.snapshot.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/sc-cnv-candidate
        run: |
          set -euo pipefail
          if [[ "$RESOLVE_MEASUREMENT_LOCK" == true || "$RESOLVE_INPUT_LOCK" == true ]]; then
            awk '$2 != "Cargo.lock"' "$EVIDENCE/files.sha256" > "$EVIDENCE/unchanged-files.sha256"
            shasum -a 256 --check "$EVIDENCE/unchanged-files.sha256" | tee "$EVIDENCE/source-after.log"
          else
            shasum -a 256 --check "$EVIDENCE/files.sha256" | tee "$EVIDENCE/source-after.log"
          fi

      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sc-cnv-core-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: ${{ runner.temp }}/sc-cnv-evidence/
          if-no-files-found: error
          retention-days: 30

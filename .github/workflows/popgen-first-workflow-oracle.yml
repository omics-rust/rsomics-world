name: Popgen complete private source oracle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-source-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: gcc:14.3.0-bookworm@sha256:a689e29bc3adf4663ef9a141d23081252764d1319c63f591a027bd6fd676f4c1
      options: --cpus 4 --memory 12g --memory-swap 12g
    env:
      POPGEN_CONTAINER_DIGEST: sha256:a689e29bc3adf4663ef9a141d23081252764d1319c63f591a027bd6fd676f4c1
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      PYTHONPATH: ''
      PIP_CONFIG_FILE: /dev/null
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      CC: /usr/local/bin/gcc
      CXX: /usr/local/bin/g++
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Create fresh private runtime and evidence roots
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          python3 -B scripts/popgen_hosted_source.py init

      - name: Admit fixed public recipient, pinned transport and finalization capacity
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          private="$POPGEN_SESSION/private"
          python3 -B scripts/popgen_hosted_source.py transport > "$private/transport.stdout" 2> "$private/transport.stderr"

      - name: Actual runtime, full engineering workflow, then whole chr22 source
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          private="$POPGEN_SESSION/private"
          python3 -B scripts/popgen_hosted_source.py execute > "$private/controller.stdout" 2> "$private/controller.stderr"

      - name: Seal every available original without exposing plaintext
        id: seal
        if: always()
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          test -n "${POPGEN_SESSION:-}"
          python3 -B scripts/popgen_hosted_source.py finalize > "$POPGEN_SESSION/finalization.stdout" 2> "$POPGEN_SESSION/finalization.stderr"

      - name: Upload only ciphertext and approved transport receipt
        if: always() && steps.seal.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: popgen-private-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.POPGEN_SESSION }}/cipher/payload.tar.age
            ${{ env.POPGEN_SESSION }}/cipher/receipt.json
          if-no-files-found: error
          retention-days: 90

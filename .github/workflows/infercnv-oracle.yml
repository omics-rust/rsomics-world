        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/validate_infercnv_shipped_oracle.py \
            "$SHIPPED_OUTPUT" --manifest 2>&1 | tee "$EVIDENCE_DIR/shipped-validation.log"

      - name: Test ingestion witness checker
        if: env.DENOISE_NATIVE_RECEIPT == 'none' && env.HMM_WORKFLOWS != 'true' && env.HMM_EXTENSION_WORKFLOWS != 'true'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s scripts \
            -p test_infercnv_ingestion_witness.py \
            2>&1 | tee "$EVIDENCE_DIR/ingestion-checker-tests.log"

      - name: Capture creation-stage raw-input witnesses
        if: env.INGESTION_CONTRACTS != 'true' && env.DENOISE_NATIVE_RECEIPT == 'none' && env.HMM_WORKFLOWS != 'true' && env.HMM_EXTENSION_WORKFLOWS != 'true'
        shell: bash
        run: |
          set -euo pipefail
          args=("$ORACLE_OUTPUT" "$EVIDENCE_DIR/ingestion-witness")
          if [[ "$ORACLE_DATASET" == shipped ]]; then args+=("$SHIPPED_OUTPUT"); fi
          sha256sum scripts/infercnv_ingestion_witness.R \
            scripts/validate_infercnv_ingestion_witness.py \
            scripts/test_infercnv_ingestion_witness.py \
            > "$EVIDENCE_DIR/ingestion-code-sha256.txt"
          Rscript --vanilla scripts/infercnv_ingestion_witness.R "${args[@]}" \
            2>&1 | tee "$EVIDENCE_DIR/ingestion-witness-run.log"
          checker=("$ORACLE_OUTPUT" "$EVIDENCE_DIR/ingestion-witness")
          if [[ "$ORACLE_DATASET" == shipped ]]; then checker+=(--shipped "$SHIPPED_OUTPUT"); fi
          PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/validate_infercnv_ingestion_witness.py \
            "${checker[@]}" 2>&1 | tee "$EVIDENCE_DIR/ingestion-witness-validation.log"

      - name: Capture creation format and filter edge probes
        if: env.ORACLE_DATASET == 'shipped' && env.INGESTION_CONTRACTS != 'true' && env.DENOISE_NATIVE_RECEIPT == 'none' && env.HMM_WORKFLOWS != 'true' && env.HMM_EXTENSION_WORKFLOWS != 'true'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s scripts \
            -p test_infercnv_creation_edges.py \
            2>&1 | tee "$EVIDENCE_DIR/creation-edge-checker-tests.log"
          sha256sum scripts/infercnv_creation_edges.R \
            scripts/validate_infercnv_creation_edges.py scripts/test_infercnv_creation_edges.py \
            > "$EVIDENCE_DIR/creation-edge-code-sha256.txt"
          Rscript --vanilla scripts/infercnv_creation_edges.R \
            "$SHIPPED_OUTPUT" "$EVIDENCE_DIR/creation-edges" \
            2>&1 | tee "$EVIDENCE_DIR/creation-edges-run.log"
          PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/validate_infercnv_creation_edges.py \
            "$SHIPPED_OUTPUT" "$EVIDENCE_DIR/creation-edges" \
            2>&1 | tee "$EVIDENCE_DIR/creation-edges-validation.log"

      - name: Acquire retained native denoise candidate
        if: env.DENOISE_NATIVE_RECEIPT != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate="$EVIDENCE_DIR/native-candidate"
          mkdir "$candidate"
          receipt="$GITHUB_WORKSPACE/.autopilot/oracles/$DENOISE_NATIVE_RECEIPT.json"
          cp "$receipt" "$candidate/receipt.json"
          python3 -B - "$receipt" > "$candidate/selection.txt" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text())
          assert r['repository']=='omics-rust/rsomics-world'
          assert type(r['run_id']) is int and r['run_id']>0
          assert type(r['artifact_id']) is int and r['artifact_id']>0
          print(r['run_id'],r['artifact_id'])
          PY
          read -r native_run native_artifact < "$candidate/selection.txt"
          gh api "repos/omics-rust/rsomics-world/actions/runs/$native_run" > "$candidate/original-run.json"
          gh api "repos/omics-rust/rsomics-world/actions/artifacts/$native_artifact" > "$candidate/original-artifact.json"
          gh api "repos/omics-rust/rsomics-world/actions/artifacts/$native_artifact/zip" > "$candidate/original-artifact.zip"
          python3 -B - "$candidate" <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile
          root=Path(__import__('sys').argv[1]);r=json.loads((root/'receipt.json').read_text())
          run=json.loads((root/'original-run.json').read_text());artifact=json.loads((root/'original-artifact.json').read_text())
          assert run['id']==r['run_id'] and run['conclusion']=='success' and run['head_sha']==r['head_sha'] and run['run_attempt']==r['run_attempt']
          assert artifact['id']==r['artifact_id'] and artifact['name']==r['artifact_name'] and not artifact['expired']
          data=(root/'original-artifact.zip').read_bytes()
          assert len(data)==r['artifact_size'] and hashlib.sha256(data).hexdigest()==r['artifact_sha256']
          assert artifact['digest']=='sha256:'+r['artifact_sha256']
          with zipfile.ZipFile(root/'original-artifact.zip') as archive:
              assert hashlib.sha256(archive.read('files.sha256')).hexdigest()==r['source_manifest_sha256']
              binary=archive.read('samples-benchmark-binary/rsomics-sc-linux-x86_64')
          assert hashlib.sha256(binary).hexdigest()==r['binary_sha256']
          path=root/'rsomics-sc';path.write_bytes(binary);path.chmod(0o755)
          PY
          printf 'DENOISE_NATIVE_BINARY=%s\n' "$candidate/rsomics-sc" >> "$GITHUB_ENV"

      - name: Compare actual raw samples and denoise workflows
        if: env.DENOISE_NATIVE_RECEIPT != 'none'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s scripts \
            -p test_compare_infercnv_denoise_workflow.py \
            2>&1 | tee "$EVIDENCE_DIR/denoise-comparison-tests.log"
          Rscript --vanilla scripts/infercnv_denoise_workflow.R \
            "$ORACLE_OUTPUT" "$SHIPPED_OUTPUT" "$EVIDENCE_DIR/denoise-workflows" \
            2>&1 | tee "$EVIDENCE_DIR/denoise-workflows.log"
          mkdir "$EVIDENCE_DIR/denoise-native-controller"
          for name in compare_infercnv_denoise_workflow.py infercnv_trial_process.py \
                      measure_infercnv.py measure_infercnv_samples_cli.py \
                      validate_infercnv_shipped_oracle.py; do
            cp "$GITHUB_WORKSPACE/scripts/$name" "$EVIDENCE_DIR/denoise-native-controller/"
          done
          PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/compare_infercnv_denoise_workflow.py \
            --synthetic "$ORACLE_OUTPUT" --shipped "$SHIPPED_OUTPUT" \
            --witness "$EVIDENCE_DIR/denoise-workflows" --binary "$DENOISE_NATIVE_BINARY" \
            --output "$EVIDENCE_DIR/denoise-native-comparison" \
            2>&1 | tee "$EVIDENCE_DIR/denoise-native-comparison.log"

      - name: Capture integrated i6 HMM workflows
        if: env.HMM_WORKFLOWS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla scripts/test_infercnv_hmm_workflow.R --installed \
            2>&1 | tee "$EVIDENCE_DIR/hmm-workflow-tests.log"
          Rscript --vanilla scripts/infercnv_hmm_workflow.R \
            "$ORACLE_OUTPUT" "$SHIPPED_OUTPUT" "$EVIDENCE_DIR/hmm-workflows" \
            2>&1 | tee "$EVIDENCE_DIR/hmm-workflows.log"

      - name: Capture actual Ward-subcluster HMM workflows
        if: env.HMM_EXTENSION_WORKFLOWS == 'true' && env.BAYES_ONLY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla scripts/test_infercnv_subclusters_workflow.R \
            2>&1 | tee "$EVIDENCE_DIR/subcluster-workflow-tests.log"
          Rscript --vanilla scripts/infercnv_subclusters_workflow.R \
            "$SHIPPED_OUTPUT" "$EVIDENCE_DIR/subcluster-workflows" \
            2>&1 | tee "$EVIDENCE_DIR/subcluster-workflows.log"

      - name: Capture actual Bayesian post-HMM workflows
        if: ${{ !cancelled() && env.HMM_EXTENSION_WORKFLOWS == 'true' && steps.extension_hmm.outcome == 'success' && steps.installed_infercnv.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla scripts/test_infercnv_bayes_workflow.R \
            2>&1 | tee "$EVIDENCE_DIR/bayes-workflow-tests.log"
          Rscript --vanilla scripts/infercnv_bayes_workflow.R \
            "$ACCEPTED_HMM_ROOT" "$EVIDENCE_DIR/bayes-workflows" \
            2>&1 | tee "$EVIDENCE_DIR/bayes-workflows.log"
          Rscript --vanilla scripts/test_infercnv_bayes_uncertainty.R \
            2>&1 | tee "$EVIDENCE_DIR/bayes-uncertainty-tests.log"
          mkdir "$EVIDENCE_DIR/bayes-uncertainty"
          cp scripts/infercnv_bayes_uncertainty.R scripts/test_infercnv_bayes_uncertainty.R \
            "$EVIDENCE_DIR/bayes-uncertainty/"
          for case_id in full_repeat1 full_repeat2; do
            Rscript --vanilla scripts/infercnv_bayes_uncertainty.R \
              "$EVIDENCE_DIR/bayes-workflows/cases/$case_id/samples" \
              "$EVIDENCE_DIR/bayes-uncertainty/$case_id.tsv" \
              2>&1 | tee "$EVIDENCE_DIR/bayes-uncertainty-$case_id.log"
          done
          python3 -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['EVIDENCE_DIR'])
          folder = root / 'bayes-uncertainty'
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          record = dict(schema_version=1,
              source_witness_sha256=sha(root / 'bayes-workflows/witness.json'),
              reducer_sha256=sha(folder / 'infercnv_bayes_uncertainty.R'),
              method='six chains; 20 nonoverlapping batches of 50 draws per chain; descriptive MCSE, not convergence proof',
              files={path.name: sha(path) for path in sorted(folder.iterdir())})
          (folder / 'manifest.json').write_text(json.dumps(record, indent=2) + '\n')
          PY

      - name: Capture samples-clustering witnesses
        if: env.SAMPLES_CLUSTERING == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$ORACLE_DATASET" = shipped
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s scripts \
            -p test_infercnv_samples_clustering_witness.py \
            2>&1 | tee "$EVIDENCE_DIR/samples-clustering-checker-tests.log"
          sha256sum scripts/infercnv_samples_clustering_witness.R \
            scripts/validate_infercnv_samples_clustering_witness.py \
            scripts/test_infercnv_samples_clustering_witness.py \
            > "$EVIDENCE_DIR/samples-clustering-code-sha256.txt"
          Rscript --vanilla scripts/infercnv_samples_clustering_witness.R \
            "$ORACLE_OUTPUT" "$SHIPPED_OUTPUT" "$EVIDENCE_DIR/samples-clustering" \
            2>&1 | tee "$EVIDENCE_DIR/samples-clustering-run.log"
          PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/validate_infercnv_samples_clustering_witness.py \
            "$ORACLE_OUTPUT" "$SHIPPED_OUTPUT" "$EVIDENCE_DIR/samples-clustering" \
            2>&1 | tee "$EVIDENCE_DIR/samples-clustering-validation.log"

      - name: Capture reference-only samples edges
        if: env.SAMPLES_CLUSTERING == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s scripts \
            -p test_infercnv_samples_reference_edges.py \
            2>&1 | tee "$EVIDENCE_DIR/samples-reference-edges-checker-tests.log"
          sha256sum scripts/infercnv_samples_reference_edges.R \
            scripts/validate_infercnv_samples_reference_edges.py \
            scripts/test_infercnv_samples_reference_edges.py \
            > "$EVIDENCE_DIR/samples-reference-edges-code-sha256.txt"
          Rscript --vanilla scripts/infercnv_samples_reference_edges.R \
            "$EVIDENCE_DIR/infercnv-$INFER_CNV_SOURCE_COMMIT" "$EVIDENCE_DIR/samples-reference-edges" \
            2>&1 | tee "$EVIDENCE_DIR/samples-reference-edges-run.log"
          PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/validate_infercnv_samples_reference_edges.py \
            "$EVIDENCE_DIR/samples-reference-edges" \
            2>&1 | tee "$EVIDENCE_DIR/samples-reference-edges-validation.log"

      - name: Validate fresh full-case measurement pins
        if: env.MATCHED_SNAPSHOT != ''
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B - "$SHIPPED_OUTPUT" <<'PY' > "$EVIDENCE_DIR/measurement-input-validation.json"
          import json, pathlib, sys
          sys.path.insert(0, str(pathlib.Path("scripts").resolve()))
          from measure_infercnv import validate_pins
          receipt = json.loads(pathlib.Path(".autopilot/oracles/infercnv-measurement-input-2026-09-26.json").read_text())
          print(json.dumps(validate_pins(pathlib.Path(sys.argv[1]), receipt), sort_keys=True))
          PY

      - name: Test matched R preparation against installed infercnv
        if: env.MATCHED_SNAPSHOT != ''
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla scripts/test_infercnv_matched.R "$SHIPPED_OUTPUT" \
            2>&1 | tee "$EVIDENCE_DIR/matched-r-tests.log"

      - name: Install Rust 1.91 and build exact matched bench
        if: env.MATCHED_SNAPSHOT != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME" "$CARGO_TARGET_DIR"
          rustup toolchain install 1.91.0 --profile minimal --no-self-update \
            2>&1 | tee "$EVIDENCE_DIR/rust-install.log"
          (
            cd "$RUST_SOURCE"
            cargo +1.91.0 build --locked --release --features infercnv-measurement \
              --bench cnv_matched --message-format=json \
              > "$EVIDENCE_DIR/cargo-build.jsonl" 2> "$EVIDENCE_DIR/cargo-build.stderr"
          )
          PYTHONDONTWRITEBYTECODE=1 python3 -B - "$EVIDENCE_DIR/cargo-build.jsonl" "$EVIDENCE_DIR/binary-identity.json" "$CARGO_TARGET_DIR" "$GITHUB_ENV" <<'PY'
          import hashlib, json, os, pathlib, stat, sys
          messages = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
          paths = [pathlib.Path(m["executable"]) for m in messages
                   if m.get("reason") == "compiler-artifact" and
                   m.get("target", {}).get("name") == "cnv_matched" and m.get("executable")]
          if len(paths) != 1:
              raise ValueError(f"expected one exact bench executable, found {len(paths)}")
          binary = paths[0]
          if (not stat.S_ISREG(binary.lstat().st_mode) or not os.access(binary, os.X_OK) or
                  pathlib.Path(sys.argv[3]).resolve() not in binary.resolve().parents):
              raise ValueError("bench executable is missing, linked, non-executable or outside target")
          identity = {"path": str(binary.resolve()), "sha256": hashlib.sha256(binary.read_bytes()).hexdigest()}
          pathlib.Path(sys.argv[2]).write_text(json.dumps(identity, indent=2) + "\n")
          with open(sys.argv[4], "a") as env:
              env.write(f"RUST_BINARY={binary.resolve()}\n")
          PY

      - name: Record matched runtime provenance
        if: env.MATCHED_SNAPSHOT != ''
        shell: bash
        run: |
          set -euo pipefail
          uname -a > "$EVIDENCE_DIR/machine.txt"
          lscpu > "$EVIDENCE_DIR/cpu.txt"
          cat /proc/loadavg > "$EVIDENCE_DIR/load-before.txt"
          rustc +1.91.0 -vV > "$EVIDENCE_DIR/rustc-version.txt"
          cargo +1.91.0 -vV > "$EVIDENCE_DIR/cargo-version.txt"
          /usr/bin/time --version > "$EVIDENCE_DIR/gnu-time-version.txt"
          Rscript --vanilla -e 'cat(capture.output(sessionInfo()), sep="\n")' > "$EVIDENCE_DIR/r-session.txt"
          printf 'OPENBLAS_NUM_THREADS=1\nOMP_NUM_THREADS=1\nMKL_NUM_THREADS=1\nBLIS_NUM_THREADS=1\nVECLIB_MAXIMUM_THREADS=1\n' > "$EVIDENCE_DIR/thread-limits.txt"
          printf 'source=%s\nbinary=%s\nprofile=release\nfeatures=infercnv-measurement\nbench=cnv_matched\n' \
            "$RUST_SOURCE" "$RUST_BINARY" > "$EVIDENCE_DIR/build-configuration.tsv"
          sha256sum scripts/infercnv_matched.R scripts/infercnv_matched_support.R \
            scripts/measure_infercnv.py scripts/verify_infercnv_measurement_snapshot.py \
            scripts/infercnv_source_snapshot.py \
            .autopilot/oracles/infercnv-measurement-input-2026-09-26.json \
            .autopilot/oracles/infercnv-measurement-candidate-2026-09-26.json \
            "$RUST_BINARY" > "$EVIDENCE_DIR/measurement-code-sha256.txt"
          printf 'CARGO_HOME=%s\nRUSTUP_HOME=%s\nCARGO_TARGET_DIR=%s\nTMPDIR=%s\nRUSTFLAGS=%s\n' \
            "$CARGO_HOME" "$RUSTUP_HOME" "$CARGO_TARGET_DIR" "$TMPDIR" "${RUSTFLAGS:-}" \
            > "$EVIDENCE_DIR/build-environment.tsv"

      - name: Run same-host matched trials
        if: env.MATCHED_SNAPSHOT != ''
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/measure_infercnv.py \
            --bundle "$SHIPPED_OUTPUT" --binary "$RUST_BINARY" \
            --output "$EVIDENCE_DIR/matched-results" \
            --input-receipt .autopilot/oracles/infercnv-measurement-input-2026-09-26.json \
            --r-script scripts/infercnv_matched.R \
            2>&1 | tee "$EVIDENCE_DIR/matched-driver.log"

      - name: Verify measurement source after trials
        if: ${{ always() && inputs.matched_snapshot != '' }}
        shell: bash
        run: |
          set -euo pipefail
          cat /proc/loadavg > "$EVIDENCE_DIR/load-after.txt"
          if [[ -d "$RUST_SOURCE" ]]; then
            PYTHONDONTWRITEBYTECODE=1 python3 -B - \
              .autopilot/oracles/infercnv-measurement-candidate-2026-09-26.json \
              ".autopilot/snapshots/sc-cnv-core-2026-09-26/$MATCHED_SNAPSHOT" \
              "$RUST_SOURCE" "$EVIDENCE_DIR" <<'PY' 2>&1 | tee "$EVIDENCE_DIR/source-after.log"
          import pathlib, sys
          sys.path.insert(0, str(pathlib.Path("scripts").resolve()))
          from verify_infercnv_measurement_snapshot import record_extracted_check
          record_extracted_check(*sys.argv[1:])
          PY
          else
            printf 'failed\n' > "$EVIDENCE_DIR/source-after.status"
            printf 'verified source never created\n' > "$EVIDENCE_DIR/source-after.error.txt"
            exit 1
          fi

      - name: Upload reference-only evidence
        if: ${{ always() && env.SAMPLES_CLUSTERING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: infercnv-reference-edges-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/infercnv-oracle/samples-reference-edges/
            ${{ runner.temp }}/infercnv-oracle/samples-locale-contract/
            ${{ runner.temp }}/infercnv-oracle/samples-reference-edges-checker-tests.log
            ${{ runner.temp }}/infercnv-oracle/samples-reference-edges-code-sha256.txt
            ${{ runner.temp }}/infercnv-oracle/samples-reference-edges-run.log
            ${{ runner.temp }}/infercnv-oracle/samples-reference-edges-validation.log
          if-no-files-found: warn

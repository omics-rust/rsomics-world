            --output "$archive"
          printf '%s  %s\n' b2a1b6f8cc09dc04562513e3cd877b3c97a6efcd5ff92cb5e0763660905e3207 "$archive" | sha256sum --check -
          export INFER_CNV_SOURCE_SHA256="$(sha256sum "$archive" | cut -d' ' -f1)"
          printf 'commit\t%s\nsha256\t%s\nurl\t%s\n' \

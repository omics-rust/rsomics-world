name: limma real complete lifecycle performance

on:
  workflow_dispatch:
    inputs:
      ordinary:
        description: Measure admitted supplied-expression lifecycle instead of the default count lifecycle
        type: boolean
        required: false
        default: false
      validation_snapshot:
        description: Ordinary-only parent-adopted green-N checker-reuse snapshot under limma-core-2026-10-28
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ORDINARY: ${{ inputs.ordinary }}
      VALIDATION_SNAPSHOT: ${{ inputs.validation_snapshot }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      EDGER_SOURCE_COMMIT: 27ba7b39d819e68df2ecdea9f32a4b6039b2a0b5
      EDGER_SOURCE_SHA256: a3cc0f66be29f1a61a74021f9848ec940794e653905c4332327a719dd9ad8393
      LIMMA_SOURCE_COMMIT: 825d1c8330d024adb6c54af66d79b0f4ec258530
      LIMMA_SOURCE_SHA256: 40b1d2059a76ad98db4bf80139760acf8e8bae92a8265aaaf16ac199831533f4
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Prepare hosted source and measurement storage
        run: |
          set -euo pipefail
          export EVIDENCE="$RUNNER_TEMP/limma-performance"
          export TMPDIR="$RUNNER_TEMP/scratch"
          export CARGO_HOME="$RUNNER_TEMP/cargo-home"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/cargo-target"
          export R_LIBS_USER="$RUNNER_TEMP/R/library"
          export R_USER_CACHE_DIR="$RUNNER_TEMP/R/cache"
          export XDG_CACHE_HOME="$RUNNER_TEMP/cache"
          export EDGER_SOURCE_ARCHIVE="$EVIDENCE/acquisition/source/artifact/edgeR_4.10.7.tar.gz"
          export LIMMA_SOURCE_ARCHIVE="$EVIDENCE/acquisition/source/artifact/limma_3.68.5.tar.gz"
          export DESEQ2_SOURCE_ARCHIVE="$EVIDENCE/acquisition/source/artifact/DESeq2_1.52.0.tar.gz"
          mkdir -p "$EVIDENCE/acquisition/native" "$EVIDENCE/acquisition/source" "$EVIDENCE/controller" \
            "$TMPDIR" "$CARGO_HOME" "$CARGO_TARGET_DIR" "$R_LIBS_USER" "$R_USER_CACHE_DIR" "$XDG_CACHE_HOME"
          for name in EVIDENCE TMPDIR CARGO_HOME CARGO_TARGET_DIR R_LIBS_USER R_USER_CACHE_DIR XDG_CACHE_HOME \
                      EDGER_SOURCE_ARCHIVE LIMMA_SOURCE_ARCHIVE DESEQ2_SOURCE_ARCHIVE; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done
          python3 -B - <<'PY'
          import json, os, shutil
          from pathlib import Path
          runner = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          paths = {name: Path(os.environ[name]).resolve(strict=True) for name in
                   ('EVIDENCE', 'TMPDIR', 'CARGO_HOME', 'CARGO_TARGET_DIR', 'R_LIBS_USER', 'R_USER_CACHE_DIR', 'XDG_CACHE_HOME')}
          assert all(path.is_relative_to(runner) for path in paths.values()), 'storage escapes runner-temp'
          usage = shutil.disk_usage(runner)
          assert usage.free > 8 * 2**30, 'insufficient measurement storage'
          (paths['EVIDENCE'] / 'storage.json').write_text(json.dumps(dict(paths={key: str(value) for key, value in paths.items()},
              disk_total=usage.total, disk_used=usage.used, disk_free=usage.free), indent=2) + '\n')
          PY
          git rev-parse HEAD > "$EVIDENCE/head.sha"
          uname -a > "$EVIDENCE/host.txt"
          df -h >> "$EVIDENCE/host.txt"
          /usr/bin/time --version >> "$EVIDENCE/host.txt"
          controller=limma_workflow_performance
          native_receipt=.autopilot/oracles/limma-native-green1-2026-10-28.json
          if [[ "$ORDINARY" == true ]]; then
            if ! [[ "$VALIDATION_SNAPSHOT" =~ ^green-[0-9]+$ ]]; then
              printf 'ordinary measurement requires an explicit green-N validation snapshot\n' >&2
              exit 1
            fi
            test -d "$GITHUB_WORKSPACE/.autopilot/snapshots/limma-core-2026-10-28/$VALIDATION_SNAPSHOT"
            controller=limma_logexpression_performance
            native_receipt=.autopilot/oracles/limma-native-green2-2026-10-31.json
          else
            test -z "$VALIDATION_SNAPSHOT"
          fi
          test -f "$native_receipt"
          printf 'PERFORMANCE_CONTROLLER=%s\nNATIVE_RECEIPT=%s\n' "$controller" "$native_receipt" >> "$GITHUB_ENV"

      - name: Acquire the exact accepted four-native executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          native="$EVIDENCE/acquisition/native"
          cp "$NATIVE_RECEIPT" "$native/receipt.json"
          native_run=$(python3 -B - <<'PY'
          import importlib, os, sys
          sys.path.insert(0, 'scripts')
          print(importlib.import_module(os.environ['PERFORMANCE_CONTROLLER']).load_native_receipt()['run_id'])
          PY
          )
          [[ "$native_run" =~ ^[0-9]+$ ]]
          gh api "repos/omics-rust/rsomics-world/actions/runs/$native_run" > "$native/run.json"
          gh api "repos/omics-rust/rsomics-world/actions/runs/$native_run/attempts/1/jobs?per_page=100" > "$native/jobs.json"
          gh api "repos/omics-rust/rsomics-world/actions/runs/$native_run/artifacts?per_page=100" > "$native/artifacts.json"
          artifact_id=$(python3 -B "scripts/$PERFORMANCE_CONTROLLER.py" select-native --acquisition "$native")
          [[ "$artifact_id" =~ ^[0-9]+$ ]]
          gh api "repos/omics-rust/rsomics-world/actions/artifacts/$artifact_id" > "$native/artifact.json"
          gh api "repos/omics-rust/rsomics-world/actions/artifacts/$artifact_id/zip" > "$native/artifact.zip"

      - name: Acquire and verify the original source witness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source="$EVIDENCE/acquisition/source"
          if [[ "$ORDINARY" == true ]]; then
            cp .autopilot/oracles/limma-logexpression-2026-10-31.json "$source/receipt.json"
            gh api repos/omics-rust/rsomics-world/actions/runs/41184814043 > "$source/run.json"
            gh api repos/omics-rust/rsomics-world/actions/artifacts/13036282988 > "$source/artifact.json"
            gh api repos/omics-rust/rsomics-world/actions/artifacts/13036282988/zip > "$source/artifact.zip"
            python3 -B "scripts/$PERFORMANCE_CONTROLLER.py" prepare-runtime --acquisition "$EVIDENCE/acquisition" \
              --validation-snapshot "$GITHUB_WORKSPACE/.autopilot/snapshots/limma-core-2026-10-28/$VALIDATION_SNAPSHOT" \
              2>&1 | tee "$EVIDENCE/acquisition/verification.log"
          else
            cp .autopilot/oracles/limma-first-workflow-2026-10-28.json "$source/receipt.json"
            gh api repos/omics-rust/rsomics-world/actions/runs/40606516204 > "$source/run.json"
            gh api repos/omics-rust/rsomics-world/actions/artifacts/12780957275 > "$source/artifact.json"
            gh api repos/omics-rust/rsomics-world/actions/artifacts/12780957275/zip > "$source/artifact.zip"
            python3 -B scripts/limma_workflow_performance.py prepare-runtime --acquisition "$EVIDENCE/acquisition" \
              2>&1 | tee "$EVIDENCE/acquisition/verification.log"
          fi

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true

      - name: Install only the selected exact released analysis sources
        run: |
          set -euo pipefail
          {
            R CMD config CC
            R CMD config CXX
            gcc --version
            g++ --version
          } > "$EVIDENCE/source-toolchain.txt"
          Rscript --vanilla - <<'RS' 2>&1 | tee "$EVIDENCE/install-dependencies.log"
          stopifnot(as.character(getRversion()) == '4.6.1')
          cran <- Sys.getenv('RSPM')
          if (!nzchar(cran)) stop('setup-r did not provide RSPM')
          options(repos=c(CRAN=cran))
          install.packages('BiocManager', lib=Sys.getenv('R_LIBS_USER'))
          BiocManager::install(version='3.23', ask=FALSE, update=FALSE)
          packages <- if (identical(Sys.getenv('ORDINARY'), 'true')) 'limma' else c('limma', 'edgeR')
          deps <- unlist(lapply(packages, function(package) {
              desc <- read.dcf(file.path(Sys.getenv('EVIDENCE'), 'acquisition/source-tree', package, 'DESCRIPTION'))
              fields <- intersect(c('Depends', 'Imports', 'LinkingTo'), colnames(desc))
              trimws(unlist(strsplit(paste(desc[1, fields], collapse=','), ',', fixed=TRUE)))
          }), use.names=FALSE)
          deps <- unique(sub('[[:space:]]*\\(.*', '', deps))
          deps <- setdiff(deps, c('R', 'limma', 'edgeR', 'DESeq2', rownames(installed.packages(priority='base'))))
          BiocManager::install(c(deps, 'digest', 'jsonlite'), ask=FALSE, update=FALSE,
                               dependencies=c('Depends', 'Imports', 'LinkingTo'), Ncpus=2L)
          missing <- setdiff(c(deps, 'digest', 'jsonlite'), rownames(installed.packages()))
          if (length(missing)) stop('missing analysis dependencies: ', paste(missing, collapse=', '))
          RS
          R CMD INSTALL --preclean --clean --library="$R_LIBS_USER" "$EVIDENCE/acquisition/source-tree/limma" \
            2>&1 | tee "$EVIDENCE/install-limma.log"
          if [[ "$ORDINARY" == true ]]; then
            Rscript --vanilla -e 'stopifnot(as.character(packageVersion("limma")) == "3.68.5", as.character(BiocManager::version()) == "3.23"); library(limma); stopifnot(!any(c("DESeq2", "edgeR") %in% loadedNamespaces()))'
          else
            R CMD INSTALL --preclean --clean --library="$R_LIBS_USER" "$EVIDENCE/acquisition/source-tree/edgeR" \
              2>&1 | tee "$EVIDENCE/install-edgeR.log"
            Rscript --vanilla -e 'stopifnot(as.character(packageVersion("edgeR")) == "4.10.7", as.character(packageVersion("limma")) == "3.68.5", as.character(BiocManager::version()) == "3.23"); library(edgeR); stopifnot(!"DESeq2" %in% loadedNamespaces())'
          fi

      - name: Measure the selected complete lifecycle
        run: |
          set -euo pipefail
          for name in limma_workflow_performance.py limma_workflow_performance.R limma_workflow_oracle.R \
                      edger_workflow_oracle.R deseq_workflow_oracle.R deseq_workflow_performance.py \
                      test_limma_workflow_performance.py infercnv_source_snapshot.py infercnv_trial_process.py \
                      verify_infercnv_oracle_artifact.py; do
            cp "scripts/$name" "$EVIDENCE/controller/"
          done
          if [[ "$ORDINARY" == true ]]; then
            for name in limma_logexpression_performance.py limma_logexpression_performance.R limma_logexpression_oracle.R; do
              cp "scripts/$name" "$EVIDENCE/controller/"
            done
            cp "$EVIDENCE/acquisition/native/validation-candidate/scripts/check-logexpression.py" \
              "$EVIDENCE/acquisition/native/validation-candidate/scripts/check-workflow.py" "$EVIDENCE/controller/"
          fi
          cp .github/workflows/limma-performance.yml "$EVIDENCE/controller/"
          (
            cd "$EVIDENCE/controller"
            sha256sum *.py *.R *.yml
          ) > "$EVIDENCE/controller/checksums.sha256"
          python3 -B "scripts/$PERFORMANCE_CONTROLLER.py" run --acquisition "$EVIDENCE/acquisition" \
            --source-tree "$EVIDENCE/acquisition/source-tree" --output "$EVIDENCE/benchmark" \
            2>&1 | tee "$EVIDENCE/benchmark.log"

      - name: Retain original inputs, failures, actual states and measurement distributions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: limma-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

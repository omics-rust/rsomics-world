name: Private HGDP PLINK whole-workflow qualification

on:
  workflow_dispatch:
    inputs:
      native_receipt:
        description: Committed actual final-source PLINK native-four/source adoption JSON
        required: true
        type: string
        default: .autopilot/oracles/plink-native-2026-11-01-green-2.json

permissions:
  contents: read
  actions: read

concurrency:
  group: plink-private-real-performance
  cancel-in-progress: false

jobs:
  private-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: gcc:14.3.0-bookworm@sha256:a689e29bc3adf4663ef9a141d23081252764d1319c63f591a027bd6fd676f4c1
      options: --cpuset-cpus 0,1,2,3 --cpus 4 --memory 8g --memory-swap 8g
    env:
      NATIVE_RECEIPT: ${{ inputs.native_receipt }}
      PLINK_CONTAINER_DIGEST: sha256:a689e29bc3adf4663ef9a141d23081252764d1319c63f591a027bd6fd676f4c1
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      CC: /usr/local/bin/gcc
      CXX: /usr/local/bin/g++
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Admit hosted private roots and encrypted finalization
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          campaign="$RUNNER_TEMP/plink-real-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$campaign"
          mkdir -m 700 "$campaign/private" "$campaign/delivery"
          printf 'PRIVATE_CAMPAIGN=%s\n' "$campaign/private" >> "$GITHUB_ENV"
          printf 'Admitting hosted encrypted retention.\n'
          python3 -B scripts/plink_real_performance.py setup --root "$campaign/private" \
            --world "$GITHUB_WORKSPACE" --native-receipt "$NATIVE_RECEIPT" \
            > "$campaign/private/setup.stdout" 2> "$campaign/private/setup.stderr"

      - name: Run fixed real whole workflow with private scientific logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          printf 'Running the fixed HGDP workflow; scientific logs remain private.\n'
          python3 -B scripts/plink_real_performance.py run --root "$PRIVATE_CAMPAIGN" \
            --world "$GITHUB_WORKSPACE" --native-receipt "$NATIVE_RECEIPT" --cpus 0,1,2,3 \
              > "$PRIVATE_CAMPAIGN/controller.stdout" 2> "$PRIVATE_CAMPAIGN/controller.stderr"

      - name: Seal all retained originals including partial failures
        if: always()
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          campaign="$RUNNER_TEMP/plink-real-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test -d "$campaign/private"
          printf 'Sealing retained originals; no plaintext upload fallback.\n'
          python3 -B scripts/plink_real_performance.py seal --root "$campaign/private" \
            --world "$GITHUB_WORKSPACE" --delivery "$campaign/delivery" \
            > "$campaign/delivery/receipt.pending" 2> "$campaign/private/seal.stderr"
          test ! -e "$campaign/delivery/receipt.json"
          mv -n "$campaign/delivery/receipt.pending" "$campaign/delivery/receipt.json"
          python3 -B - "$campaign/delivery/receipt.json" <<'PY'
          import json, sys
          row = json.load(open(sys.argv[1]))
          print(json.dumps({key: row[key] for key in ('schema', 'status', 'context', 'ciphertext',
              'recipient_sha256', 'age_version', 'age_archive_sha256', 'producer_exit', 'age_exit')}, sort_keys=True))
          PY

      - name: Upload encrypted originals only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plink-real-encrypted-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/plink-real-${{ github.run_id }}-${{ github.run_attempt }}/delivery/hgdp.tar.age
            ${{ runner.temp }}/plink-real-${{ github.run_id }}-${{ github.run_attempt }}/delivery/receipt.json
          retention-days: 90
          compression-level: 0
          if-no-files-found: error

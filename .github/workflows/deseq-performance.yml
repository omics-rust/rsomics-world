name: DESeq real complete count-to-export performance

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      DESEQ2_SOURCE_COMMIT: 16aeab6d6158bd8cbb8e98764c2f33399b1a3fd3
      DESEQ2_SOURCE_SHA256: 8c91699286336350e66eec132ce6fdf5bb4af78e2a4d015a5a61224f62a95984
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Prepare hosted source and measurement storage
        run: |
          set -euo pipefail
          export EVIDENCE="$RUNNER_TEMP/deseq-performance"
          export TMPDIR="$RUNNER_TEMP/scratch"
          export CARGO_HOME="$RUNNER_TEMP/cargo-home"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/cargo-target"
          export R_LIBS_USER="$RUNNER_TEMP/R/library"
          export R_USER_CACHE_DIR="$RUNNER_TEMP/R/cache"
          export XDG_CACHE_HOME="$RUNNER_TEMP/cache"
          export DESEQ2_SOURCE_ARCHIVE="$EVIDENCE/acquisition/source/artifact/DESeq2_1.52.0.tar.gz"
          mkdir -p "$EVIDENCE/acquisition/native" "$EVIDENCE/acquisition/source" "$EVIDENCE/controller" \
            "$EVIDENCE/runtime" "$TMPDIR" "$CARGO_HOME" "$CARGO_TARGET_DIR" "$R_LIBS_USER" "$R_USER_CACHE_DIR" "$XDG_CACHE_HOME"
          printf 'EVIDENCE=%s\nTMPDIR=%s\nCARGO_HOME=%s\nCARGO_TARGET_DIR=%s\nR_LIBS_USER=%s\nR_USER_CACHE_DIR=%s\nXDG_CACHE_HOME=%s\nDESEQ2_SOURCE_ARCHIVE=%s\n' \
            "$EVIDENCE" "$TMPDIR" "$CARGO_HOME" "$CARGO_TARGET_DIR" "$R_LIBS_USER" "$R_USER_CACHE_DIR" "$XDG_CACHE_HOME" "$DESEQ2_SOURCE_ARCHIVE" >> "$GITHUB_ENV"
          python3 -B - <<'PY'
          import json, os, shutil
          from pathlib import Path
          runner = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          paths = {name: Path(os.environ[name]).resolve(strict=True) for name in
                   ('EVIDENCE', 'TMPDIR', 'CARGO_HOME', 'CARGO_TARGET_DIR', 'R_LIBS_USER', 'R_USER_CACHE_DIR', 'XDG_CACHE_HOME')}
          assert all(path.is_relative_to(runner) for path in paths.values()), 'storage escapes runner-temp'
          usage = shutil.disk_usage(runner)
          assert usage.free > 8 * 2**30, 'insufficient benchmark storage'
          (paths['EVIDENCE'] / 'storage.json').write_text(json.dumps(dict(paths={key: str(value) for key, value in paths.items()},
              disk_total=usage.total, disk_used=usage.used, disk_free=usage.free), indent=2) + '\n')
          PY
          git rev-parse HEAD > "$EVIDENCE/head.sha"
          uname -a > "$EVIDENCE/host.txt"
          df -h >> "$EVIDENCE/host.txt"
          /usr/bin/time --version >> "$EVIDENCE/host.txt"

      - name: Acquire the exact accepted four-native executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          native="$EVIDENCE/acquisition/native"
          gh api repos/omics-rust/rsomics-world/actions/runs/40611588271 > "$native/run.json"
          gh api 'repos/omics-rust/rsomics-world/actions/runs/40611588271/attempts/1/jobs?per_page=100' > "$native/jobs.json"
          gh api 'repos/omics-rust/rsomics-world/actions/runs/40611588271/artifacts?per_page=100' > "$native/artifacts.json"
          artifact_id=$(python3 -B scripts/deseq_workflow_performance.py select-native --acquisition "$native")
          [[ "$artifact_id" =~ ^[0-9]+$ ]]
          gh api "repos/omics-rust/rsomics-world/actions/artifacts/$artifact_id" > "$native/artifact.json"
          gh api "repos/omics-rust/rsomics-world/actions/artifacts/$artifact_id/zip" > "$native/artifact.zip"

      - name: Acquire and verify the original source witness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source="$EVIDENCE/acquisition/source"
          cp .autopilot/oracles/deseq-first-workflow-2026-10-28.json "$source/receipt.json"
          gh api repos/omics-rust/rsomics-world/actions/runs/40561801963 > "$source/run.json"
          gh api repos/omics-rust/rsomics-world/actions/artifacts/12761202566 > "$source/artifact.json"
          gh api repos/omics-rust/rsomics-world/actions/artifacts/12761202566/zip > "$source/artifact.zip"
          python3 -B scripts/deseq_workflow_performance.py prepare-runtime --acquisition "$EVIDENCE/acquisition" \
            2>&1 | tee "$EVIDENCE/acquisition/verification.log"
          printf '%s  %s\n' "$DESEQ2_SOURCE_SHA256" "$DESEQ2_SOURCE_ARCHIVE" | sha256sum --check -
          tar -xzf "$DESEQ2_SOURCE_ARCHIVE" -C "$EVIDENCE/runtime"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true

      - name: Install the exact released source runtime
        run: |
          set -euo pipefail
          {
            R CMD config CC
            R CMD config CXX
            gcc --version
            g++ --version
          } > "$EVIDENCE/source-toolchain.txt"
          Rscript --vanilla - <<'RS' 2>&1 | tee "$EVIDENCE/install-dependencies.log"
          stopifnot(as.character(getRversion()) == '4.6.1')
          cran <- Sys.getenv('RSPM')
          if (!nzchar(cran)) stop('setup-r did not provide RSPM')
          options(repos=c(CRAN=cran))
          install.packages('BiocManager', lib=Sys.getenv('R_LIBS_USER'))
          BiocManager::install(version='3.23', ask=FALSE, update=FALSE)
          desc <- read.dcf(file.path(Sys.getenv('EVIDENCE'), 'runtime/DESeq2/DESCRIPTION'))
          fields <- intersect(c('Depends', 'Imports', 'LinkingTo'), colnames(desc))
          deps <- trimws(unlist(strsplit(paste(desc[1, fields], collapse=','), ',', fixed=TRUE)))
          deps <- unique(sub('[[:space:]]*\\(.*', '', deps))
          deps <- setdiff(deps, c('R', rownames(installed.packages(priority='base'))))
          BiocManager::install(c(deps, 'digest', 'jsonlite'), ask=FALSE, update=FALSE,
                               dependencies=c('Depends', 'Imports', 'LinkingTo'), Ncpus=2L)
          missing <- setdiff(c(deps, 'digest', 'jsonlite'), rownames(installed.packages()))
          if (length(missing)) stop('missing source dependencies: ', paste(missing, collapse=', '))
          RS
          R CMD INSTALL --preclean --clean --library="$R_LIBS_USER" "$EVIDENCE/runtime/DESeq2" \
            2>&1 | tee "$EVIDENCE/install-DESeq2.log"
          Rscript --vanilla -e 'stopifnot(as.character(packageVersion("DESeq2")) == "1.52.0", as.character(BiocManager::version()) == "3.23"); library(DESeq2)'

      - name: Measure the original complete count-to-export workflow
        run: |
          set -euo pipefail
          for name in deseq_workflow_performance.py deseq_workflow_performance.R deseq_workflow_oracle.R \
                      test_deseq_workflow_performance.py infercnv_source_snapshot.py infercnv_trial_process.py \
                      verify_infercnv_oracle_artifact.py; do
            cp "scripts/$name" "$EVIDENCE/controller/"
          done
          (
            cd "$EVIDENCE/controller"
            sha256sum *.py *.R
          ) > "$EVIDENCE/controller/checksums.sha256"
          python3 -B scripts/deseq_workflow_performance.py run --acquisition "$EVIDENCE/acquisition" \
            --source-tree "$EVIDENCE/runtime/DESeq2" --output "$EVIDENCE/benchmark" \
            2>&1 | tee "$EVIDENCE/benchmark.log"

      - name: Retain all real inputs, failures and measurement distributions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deseq-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

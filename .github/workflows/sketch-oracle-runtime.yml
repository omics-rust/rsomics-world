name: Sketch oracle ARM runtime diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12.14', '3.12.15']
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONFAULTHANDLER: '1'
    steps:
      - name: Prepare isolated runner paths
        run: |
          mkdir -p "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          echo "PIP_CACHE_DIR=$RUNNER_TEMP/pip-cache" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/cache" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Recreate the failed oracle package selection
        run: |
          ulimit -c 0
          uname -a > "$RUNNER_TEMP/evidence/machine.txt"
          test "$(uname -m)" = aarch64
          python -VV > "$RUNNER_TEMP/evidence/python.txt"
          python -m pip --version > "$RUNNER_TEMP/evidence/pip-version.txt"
          python -m pip install --report "$RUNNER_TEMP/evidence/pip-install.json" \
            sourmash==4.9.4 bitstring==4.4.0 bitarray==3.12.3 cachetools==6.2.6 \
            screed==1.2.0 tibs==0.5.7 cffi==2.1.1 deprecation==2.1.0 \
            matplotlib==3.11.2 contourpy==1.4.0 cycler==0.12.1 fonttools==4.68.0 \
            kiwisolver==1.5.1 numpy==2.5.4 packaging==26.3 pillow==13.0.0 \
            pyparsing==3.3.3 python-dateutil==4.0.0 pycparser==3.12 scipy==1.18.1 \
            tzdata==2026.6 2>&1 | tee "$RUNNER_TEMP/evidence/pip-install.log"
          python -m pip freeze > "$RUNNER_TEMP/evidence/pip-freeze.txt"
      - name: Isolate import and process-exit failures without product execution
        run: |
          ulimit -c 0
          python -B - <<'PY'
          import hashlib, json, os, shutil, subprocess, sys
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'evidence'
          commands = [('python', [sys.executable, '-X', 'faulthandler', '-c', 'print("runtime")'])]
          for label, module in (('cffi-backend', '_cffi_backend'), ('numpy', 'numpy'),
                                ('scipy-native', 'scipy.optimize, scipy.stats'),
                                ('bitstring', 'bitstring'), ('sourmash', 'sourmash')):
              code = (f'import {module}; import sys; print("imported {module}", flush=True); '
                      'print("\\n".join(sorted(sys.modules)), flush=True)')
              commands.append((label, [sys.executable, '-X', 'faulthandler', '-c', code]))
          entry = shutil.which('sourmash')
          assert entry
          commands.append(('version', [entry, '--version']))
          records = []
          for name, argv in commands:
              with (root / (name + '.stdout')).open('xb') as out, (root / (name + '.stderr')).open('xb') as err:
                  completed = subprocess.run(argv, stdout=out, stderr=err, timeout=90)
              records.append(dict(name=name, argv=argv, returncode=completed.returncode))
          (root / 'commands.json').write_text(json.dumps(records, indent=2) + '\n')
          gdb = shutil.which('gdb')
          crashed = any(row['returncode'] in (-11, 139) for row in records)
          if crashed and gdb:
              argv = [gdb, '--batch', '--quiet', '-ex', 'set pagination off', '-ex', 'run',
                      '-ex', 'thread apply all bt', '--args', sys.executable,
                      '-X', 'faulthandler', entry, '--version']
              with (root / 'gdb.stdout').open('xb') as out, (root / 'gdb.stderr').open('xb') as err:
                  result = subprocess.run(argv, stdout=out, stderr=err, timeout=120)
              (root / 'gdb-command.json').write_text(json.dumps(dict(argv=argv, returncode=result.returncode), indent=2) + '\n')
          summary = dict(scope='Oracle environment diagnosis only; no product/native/performance qualification',
              python=sys.version, executable=sys.executable, entry=entry,
              entry_sha256=hashlib.sha256(Path(entry).read_bytes()).hexdigest(),
              gdb_available=bool(gdb), commands=records)
          (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          if any(row['returncode'] for row in records):
              raise SystemExit('one or more oracle runtime probes failed')
          PY
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: sketch-oracle-runtime-python-${{ matrix.python }}-${{ github.sha }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 90

name: limma actual current voom fitted-workflow oracle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      EDGER_SOURCE_COMMIT: 27ba7b39d819e68df2ecdea9f32a4b6039b2a0b5
      EDGER_SOURCE_SHA256: a3cc0f66be29f1a61a74021f9848ec940794e653905c4332327a719dd9ad8393
      LIMMA_SOURCE_COMMIT: 825d1c8330d024adb6c54af66d79b0f4ec258530
      LIMMA_SOURCE_SHA256: 40b1d2059a76ad98db4bf80139760acf8e8bae92a8265aaaf16ac199831533f4
      DESEQ2_SOURCE_SHA256: 8c91699286336350e66eec132ce6fdf5bb4af78e2a4d015a5a61224f62a95984
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare hosted source and library storage
        run: |
          set -euo pipefail
          export EVIDENCE="$RUNNER_TEMP/limma-oracle"
          export TMPDIR="$RUNNER_TEMP/scratch"
          export R_LIBS_USER="$RUNNER_TEMP/R/library"
          export R_USER_CACHE_DIR="$RUNNER_TEMP/R/cache"
          export XDG_CACHE_HOME="$RUNNER_TEMP/cache"
          export CARGO_HOME="$RUNNER_TEMP/cargo-home"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/cargo-target"
          export EDGER_SOURCE_ARCHIVE="$EVIDENCE/edgeR_4.10.7.tar.gz"
          export LIMMA_SOURCE_ARCHIVE="$EVIDENCE/limma_3.68.5.tar.gz"
          export DESEQ2_SOURCE_ARCHIVE="$EVIDENCE/DESeq2_1.52.0.tar.gz"
          mkdir -p "$EVIDENCE/controller" "$TMPDIR" "$R_LIBS_USER" "$R_USER_CACHE_DIR" "$XDG_CACHE_HOME" "$CARGO_HOME" "$CARGO_TARGET_DIR"
          printf 'EVIDENCE=%s\nTMPDIR=%s\nR_LIBS_USER=%s\nR_USER_CACHE_DIR=%s\nXDG_CACHE_HOME=%s\nCARGO_HOME=%s\nCARGO_TARGET_DIR=%s\nEDGER_SOURCE_ARCHIVE=%s\nLIMMA_SOURCE_ARCHIVE=%s\nDESEQ2_SOURCE_ARCHIVE=%s\n' \
            "$EVIDENCE" "$TMPDIR" "$R_LIBS_USER" "$R_USER_CACHE_DIR" "$XDG_CACHE_HOME" "$CARGO_HOME" "$CARGO_TARGET_DIR" "$EDGER_SOURCE_ARCHIVE" "$LIMMA_SOURCE_ARCHIVE" "$DESEQ2_SOURCE_ARCHIVE" >> "$GITHUB_ENV"
          python3 -B - <<'PY'
          import json, os, shutil
          from pathlib import Path
          runner = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          paths = {name: Path(os.environ[name]).resolve(strict=True) for name in
                   ('EVIDENCE', 'TMPDIR', 'R_LIBS_USER', 'R_USER_CACHE_DIR', 'XDG_CACHE_HOME', 'CARGO_HOME', 'CARGO_TARGET_DIR')}
          assert all(path.is_relative_to(runner) for path in paths.values()), 'storage escapes runner-temp'
          usage = shutil.disk_usage(runner)
          assert usage.free > 8 * 2**30, 'insufficient oracle storage'
          (paths['EVIDENCE'] / 'storage.json').write_text(json.dumps(dict(paths={key: str(value) for key, value in paths.items()},
              disk_total=usage.total, disk_free=usage.free), indent=2) + '\n')
          PY
          git rev-parse HEAD > "$EVIDENCE/head.sha"
          uname -a > "$EVIDENCE/host.txt"
          df -h >> "$EVIDENCE/host.txt"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true

      - name: Acquire the exact released sources and original input carrier
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://bioconductor.org/packages/3.23/bioc/src/contrib/edgeR_4.10.7.tar.gz \
            --output "$EDGER_SOURCE_ARCHIVE"
          curl --fail --location --retry 3 \
            https://bioconductor.org/packages/3.23/bioc/src/contrib/limma_3.68.5.tar.gz \
            --output "$LIMMA_SOURCE_ARCHIVE"
          curl --fail --location --retry 3 \
            https://bioconductor.org/packages/3.23/bioc/src/contrib/DESeq2_1.52.0.tar.gz \
            --output "$DESEQ2_SOURCE_ARCHIVE"
          {
            printf '%s  %s\n' "$EDGER_SOURCE_SHA256" "$EDGER_SOURCE_ARCHIVE"
            printf '%s  %s\n' "$LIMMA_SOURCE_SHA256" "$LIMMA_SOURCE_ARCHIVE"
            printf '%s  %s\n' "$DESEQ2_SOURCE_SHA256" "$DESEQ2_SOURCE_ARCHIVE"
          } | sha256sum --check - | tee "$EVIDENCE/source-verification.log"
          python3 -B - <<'PY'
          import json, os, tarfile
          from pathlib import Path
          required = {
              'EDGER_SOURCE_ARCHIVE': ['edgeR/R/DGEList.R', 'edgeR/R/voomLmFit.R', 'edgeR/R/glmfit.R'],
              'LIMMA_SOURCE_ARCHIVE': ['limma/R/lmfit.R', 'limma/R/toptable.R', 'limma/R/contrasts.R', 'limma/R/ebayes.R'],
              'DESEQ2_SOURCE_ARCHIVE': ['DESeq2/inst/extdata/pasilla_gene_counts.tsv.gz',
                                       'DESeq2/inst/extdata/pasilla_sample_annotation.csv']}
          for variable, expected in required.items():
              with tarfile.open(os.environ[variable]) as archive:
                  names = set(archive.getnames())
              assert set(expected) <= names, 'case-sensitive source member missing: ' + variable
          (Path(os.environ['EVIDENCE']) / 'source-member-routes.json').write_text(json.dumps(required, indent=2) + '\n')
          PY
          for archive in "$EDGER_SOURCE_ARCHIVE" "$LIMMA_SOURCE_ARCHIVE" "$DESEQ2_SOURCE_ARCHIVE"; do
            tar -xzf "$archive" -C "$EVIDENCE"
          done
          test "$(sed -n 's/^Version: //p' "$EVIDENCE/edgeR/DESCRIPTION")" = '4.10.7'
          test "$(sed -n 's/^Version: //p' "$EVIDENCE/limma/DESCRIPTION")" = '3.68.5'

      - name: Install required dependencies and both exact released sources
        run: |
          set -euo pipefail
          Rscript --vanilla - <<'RS' 2>&1 | tee "$EVIDENCE/install-dependencies.log"
          stopifnot(as.character(getRversion()) == '4.6.1')
          cran <- Sys.getenv('RSPM')
          if (!nzchar(cran)) stop('setup-r did not provide RSPM')
          options(repos=c(CRAN=cran))
          install.packages('BiocManager', lib=Sys.getenv('R_LIBS_USER'))
          BiocManager::install(version='3.23', ask=FALSE, update=FALSE)
          deps <- unlist(lapply(c('limma', 'edgeR'), function(package) {
              desc <- read.dcf(file.path(Sys.getenv('EVIDENCE'), package, 'DESCRIPTION'))
              fields <- intersect(c('Depends', 'Imports', 'LinkingTo'), colnames(desc))
              trimws(unlist(strsplit(paste(desc[1, fields], collapse=','), ',', fixed=TRUE)))
          }), use.names=FALSE)
          deps <- unique(sub('[[:space:]]*\\(.*', '', deps))
          deps <- setdiff(deps, c('R', 'limma', 'edgeR', rownames(installed.packages(priority='base'))))
          BiocManager::install(c(deps, 'digest', 'jsonlite'), ask=FALSE, update=FALSE,
                               dependencies=c('Depends', 'Imports', 'LinkingTo'), Ncpus=2L)
          missing <- setdiff(c(deps, 'digest', 'jsonlite'), rownames(installed.packages()))
          if (length(missing)) stop('missing oracle dependencies: ', paste(missing, collapse=', '))
          RS
          R CMD INSTALL --preclean --clean --library="$R_LIBS_USER" "$EVIDENCE/limma" \
            2>&1 | tee "$EVIDENCE/install-limma.log"
          R CMD INSTALL --preclean --clean --library="$R_LIBS_USER" "$EVIDENCE/edgeR" \
            2>&1 | tee "$EVIDENCE/install-edgeR.log"
          Rscript --vanilla -e 'stopifnot(as.character(packageVersion("edgeR")) == "4.10.7", as.character(packageVersion("limma")) == "3.68.5", as.character(BiocManager::version()) == "3.23"); library(edgeR)'

      - name: Capture the complete current voom fitted workflow
        run: |
          set -euo pipefail
          cp scripts/deseq_workflow_oracle.R scripts/edger_workflow_oracle.R scripts/limma_workflow_oracle.R "$EVIDENCE/controller/"
          (
            cd "$EVIDENCE/controller"
            sha256sum *.R
          ) > "$EVIDENCE/controller/checksums.sha256"
          Rscript --vanilla scripts/limma_workflow_oracle.R "$EVIDENCE/edgeR" "$EVIDENCE/limma" "$EVIDENCE/DESeq2" "$EVIDENCE/workflow" \
            2>&1 | tee "$EVIDENCE/workflow.log"

      - name: Retain original sources and complete workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: limma-oracle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

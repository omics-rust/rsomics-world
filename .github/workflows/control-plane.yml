name: Control plane

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Test control-plane scripts
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          printf 'Runner: %s; %s\n' "$(uname -sr)" "$(python3 --version)" >> "$GITHUB_STEP_SUMMARY"
          log="$RUNNER_TEMP/control-tests.log"
          if ! python3 -B -m unittest discover -s scripts -p 'test_*.py' 2>&1 | tee "$log"; then
            tail -n 100 "$log" | python3 -B -c 'import sys; text = sys.stdin.read()[-16000:]; print("::error title=Control-plane tests failed::" + text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
            exit 1
          fi
      - name: Validate architecture ledgers
        run: python3 -B scripts/validate_control_plane.py

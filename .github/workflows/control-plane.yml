name: Control plane

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test architecture validation
        run: python3 -B -m unittest discover -s scripts -p test_validate_control_plane.py
      - name: Validate architecture ledgers
        run: python3 -B scripts/validate_control_plane.py
